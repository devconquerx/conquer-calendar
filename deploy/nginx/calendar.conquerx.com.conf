# nginx del VPS de producción — copia versionada de
# /etc/nginx/sites-available/calendar.conquerx.com.conf
#
# El upstream `calendar_app` NO se define aquí: lo genera deploy/prod-deploy.sh
# en /etc/nginx/conf.d/calendar-upstream.conf apuntando al color activo
# (blue=8001 / green=8002). Cambiar de color = reescribir ese fichero +
# `nginx -s reload`, que es una recarga elegante: los workers viejos terminan
# los requests que ya tenían en vuelo y los nuevos entran por el color nuevo.
# Ni un request perdido.
#
# Instalar con:  bash deploy/prod-deploy.sh install-nginx

server {
    server_name calendar.conquerx.com 167.172.146.251;

    client_max_body_size 25m;

    location /static/ {
        alias /home/conquer-calendar/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/conquer-calendar/app/calendario-media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Igual que `location /` pero devolviendo qué backend respondió
    # (X-Upstream: 127.0.0.1:8001|8002). Lo usa el deploy para verificar que el
    # swap de color tomó efecto de verdad.
    location = /health/ {
        proxy_pass http://calendar_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Upstream $upstream_addr always;
        access_log off;
    }

    location / {
        proxy_pass http://calendar_app;

        # keepalive contra el upstream (requiere HTTP/1.1 y Connection vacío):
        # ahorra un handshake TCP por request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;

        # Red de seguridad: si el color activo no acepta la conexión, nginx
        # reintenta en el otro (declarado `backup` en el upstream). Los POST no
        # se reintentan si ya se enviaron (comportamiento por defecto de nginx
        # desde 1.9.13), así que un lead nunca se procesa dos veces.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/calendar.conquerx.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/calendar.conquerx.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = calendar.conquerx.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name calendar.conquerx.com 167.172.146.251;
    return 404; # managed by Certbot


}
